<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2f6f4f">
<title>中間考査スタディプラン</title>
<style>
  :root{
    --bg:#eef1ec;
    --paper:#ffffff;
    --ink:#202a22;
    --ink-soft:#5b665e;
    --line:#d6dcd0;
    --accent:#2f6f4f;
    --accent-soft:#e3efe6;
    --today:#c0472c;
    --today-soft:#fbe9e4;
    --done-bg:#eef3ea;
    --g:#3b6ea5; --g-soft:#e5edf5;
    --e:#b5651d; --e-soft:#f6e9db;
    --j:#7a4fa3; --j-soft:#efe5f5;
    --s:#2f8f6f; --s-soft:#e2f1ec;
    --a:#c23b5d; --a-soft:#f7e2e7;
    --p:#0f8f82; --p-soft:#dff2ef;
    --z:#8a6d3b; --z-soft:#f1e9da;
    --font-display:"Kaisei Decol", "Hiragino Mincho ProN", serif;
    --font-body:"Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --bg:#151a16; --paper:#1e2420; --ink:#e7ece5; --ink-soft:#a6b1a3;
      --line:#333e34; --accent:#67b78c; --accent-soft:#223a2d;
      --today:#e2785d; --today-soft:#3a2420; --done-bg:#1f2922;
      --g:#7ea6dc; --g-soft:#1f2c3a;
      --e:#e2a066; --e-soft:#352a1d;
      --j:#bd94dc; --j-soft:#2c2436;
      --s:#6fc8a4; --s-soft:#1b332a;
      --a:#e28198; --a-soft:#36222a;
      --p:#5fd0c3; --p-soft:#1a332f;
      --z:#c7ab77; --z-soft:#332c1d;
    }
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--font-body);
    font-size:16px;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }
  img{max-width:100%}
  [hidden]{display:none!important}

  #app{max-width:640px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}

  h1{font-family:var(--font-display);font-weight:700;font-size:1.55rem;margin:0;letter-spacing:.01em}
  .sub{color:var(--ink-soft);font-size:.85rem;margin-top:4px}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px}

  .stat-row{display:flex;gap:12px;flex-wrap:wrap}
  .stat{flex:1;min-width:120px;display:flex;flex-direction:column;gap:2px}
  .stat .num{font-family:var(--font-display);font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1}
  .stat .lbl{font-size:.72rem;color:var(--ink-soft);letter-spacing:.04em}

  .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:12px}
  .bar > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}

  .section-title{font-family:var(--font-display);font-size:1.05rem;font-weight:700;display:flex;align-items:baseline;gap:8px;margin:0}
  .section-title .count{font-size:.78rem;color:var(--ink-soft);font-weight:400}

  .today-card{border-color:var(--today);background:var(--today-soft)}
  .today-list{display:flex;flex-direction:column;gap:14px;margin-top:12px}
  .today-empty{color:var(--ink-soft);font-size:.9rem;margin-top:10px}
  .today-sub{display:flex;flex-direction:column;gap:6px}
  .today-sub-head{display:flex;align-items:center;gap:7px;font-size:.78rem;font-weight:700;color:var(--ink)}
  .today-sub-head .swatch{width:8px;height:8px}
  .today-sub-head .cnt{font-weight:400;color:var(--ink-soft);font-size:.72rem}
  .today-rows{display:flex;flex-direction:column;gap:5px}

  .task{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;cursor:pointer;background:transparent;border:1px solid transparent;text-align:left;width:100%;font-family:inherit;font-size:.9rem;color:var(--ink);-webkit-appearance:none;appearance:none}
  .task:hover{border-color:var(--line)}
  .task.done{background:var(--done-bg);color:var(--ink-soft)}
  .task.done .label{text-decoration:line-through;text-decoration-thickness:1px}

  .box{flex:none;width:19px;height:19px;border-radius:5px;border:1.6px solid var(--ink-soft);display:flex;align-items:center;justify-content:center}
  .task.done .box{background:var(--accent);border-color:var(--accent)}
  .box svg{width:12px;height:12px;opacity:0;stroke:#fff;stroke-width:3;fill:none}
  .task.done .box svg{opacity:1}

  .tpill{flex:none;font-size:.68rem;padding:2px 7px;border-radius:99px;font-weight:500;white-space:nowrap}
  .label{flex:1;line-height:1.3}

  .subject-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .subject-name{font-family:var(--font-display);font-weight:700;font-size:1rem;display:flex;align-items:center;gap:8px}
  .swatch{width:9px;height:9px;border-radius:50%;flex:none}
  .subject-meta{font-size:.72rem;color:var(--ink-soft)}

  .group{margin-bottom:14px}
  .group:last-child{margin-bottom:0}
  .group-title{font-size:.72rem;color:var(--ink-soft);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
  .group-title .gcount{font-variant-numeric:tabular-nums}

  .chip-grid{display:flex;flex-wrap:wrap;gap:6px}
  .chip{flex:none;min-width:38px;padding:7px 8px;border-radius:7px;border:1.3px solid var(--line);background:transparent;font-family:inherit;font-size:.78rem;font-variant-numeric:tabular-nums;cursor:pointer;color:var(--ink);text-align:center;line-height:1.2;-webkit-appearance:none;appearance:none}
  .chip.wide{min-width:auto;padding:7px 11px}

  .reset-row{text-align:center;margin-top:4px}
  .reset-btn{background:none;border:none;color:var(--ink-soft);font-size:.82rem;padding:8px 10px;border-radius:8px;cursor:pointer;font-family:inherit;-webkit-appearance:none;appearance:none}
  .reset-btn.confirm{color:var(--today);font-weight:600}

  .done-banner{display:none;text-align:center;padding:14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-family:var(--font-display);font-weight:700;font-size:1rem}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "chukan_study_plan_v1";

  var SUBJECTS = [
    {code:"G", name:"幾何",     day:"10/20(火)", c:"--g", cs:"--g-soft"},
    {code:"E", name:"英語",     day:"10/20(火)", c:"--e", cs:"--e-soft"},
    {code:"J", name:"国語",     day:"10/21(水)", c:"--j", cs:"--j-soft"},
    {code:"S", name:"社会",     day:"10/21(水)", c:"--s", cs:"--s-soft"},
    {code:"A", name:"代数",     day:"10/22(木)", c:"--a", cs:"--a-soft"},
    {code:"P", name:"物理生物", day:"10/22(木)", c:"--p", cs:"--p-soft"},
    {code:"Z", name:"地学",     day:"10/22(木)", c:"--z", cs:"--z-soft"}
  ];

  function range(a,b){ var r=[]; for(var i=a;i<=b;i++) r.push(i); return r; }

  var GROUP_DEFS = [
    {s:"G", idTag:"GT", title:"教科書 幾何・統計編 p.46〜72",            short:"教科書",   nums:range(46,72), pageFmt:function(n){return "p."+n}},
    {s:"G", idTag:"GW", title:"問題集vol.4 p.52〜89(問題151まで)",        short:"問題集",   nums:range(52,89), pageFmt:function(n){return "p."+n}},

    {s:"E", idTag:"ET", title:"NEW TREASURE STAGE1 p.60〜89",            short:"教科書",   nums:range(60,89), pageFmt:function(n){return "p."+n}},

    {s:"J", idTag:"JS", title:"さんちき p.92〜111",                       short:"さんちき", nums:range(92,111), pageFmt:function(n){return "p."+n}},
    {s:"J", idTag:"JT", title:"竹取物語 p.147〜148",                      short:"竹取物語", nums:range(147,148), pageFmt:function(n){return "p."+n}},
    {s:"J", idTag:"JD", title:"動詞(かんたん文法) p.20〜24",               short:"動詞",     nums:range(20,24), pageFmt:function(n){return "p."+n}},
    {s:"J", idTag:"JH", title:"百人一首 1〜50番",                         short:"百人一首", labels:["1〜10番","11〜20番","21〜30番","31〜40番","41〜50番"]},
    {s:"J", idTag:"JE", title:"徹底演習テキスト 説明文 p.106〜115",        short:"徹底演習", nums:range(106,115), pageFmt:function(n){return "p."+n}},

    {s:"S", idTag:"ST1", title:"教科書 pp.128〜139",                      short:"教科書",   nums:range(128,139), pageFmt:function(n){return "p."+n}},
    {s:"S", idTag:"ST2", title:"教科書 pp.146〜157",                      short:"教科書",   nums:range(146,157), pageFmt:function(n){return "p."+n}},
    {s:"S", idTag:"SW",  title:"問題集 pp.108〜123",                      short:"問題集",   nums:range(108,123), pageFmt:function(n){return "p."+n}},
    {s:"S", idTag:"SN",  title:"夏期課題(自然災害・日本の人口)",            short:"夏期課題", labels:["復習"]},
    {s:"S", idTag:"SM",  title:"地図帳",                                 short:"地図帳",   labels:["授業で扱ったページを確認"]},

    {s:"A", idTag:"AT",  title:"教科書 代数編 p.82〜117",                 short:"教科書",   nums:range(82,117), pageFmt:function(n){return "p."+n}},
    {s:"A", idTag:"AW1", title:"問題集vol.1(問題132〜150) p.93〜107",      short:"問題集vol.1", nums:range(93,107), pageFmt:function(n){return "p."+n}},
    {s:"A", idTag:"AW2", title:"問題集vol.2(問題159〜198) p.2〜39",        short:"問題集vol.2", nums:range(2,39), pageFmt:function(n){return "p."+n}},
    {s:"A", idTag:"AW3", title:"問題集(問題213〜229) p.48〜55",            short:"問題集",   nums:range(48,55), pageFmt:function(n){return "p."+n}},

    {s:"P", idTag:"PB",  title:"生物 根のつくりとはたらき 問題集p.70〜75", short:"生物",     nums:range(70,75), pageFmt:function(n){return "p."+n}},
    {s:"P", idTag:"PP",  title:"物理 波の性質・光・レンズ 問題集p.6〜21",  short:"物理",     nums:range(6,21), pageFmt:function(n){return "p."+n}},

    {s:"Z", idTag:"ZP",  title:"地学プリント No.18〜25",                  short:"プリント", nums:range(18,25), pageFmt:function(n){return "No."+n}},
    {s:"Z", idTag:"ZT",  title:"中学校の地学 p.57〜77",                   short:"地学",     nums:range(57,77), pageFmt:function(n){return "p."+n}},
    {s:"Z", idTag:"ZS",  title:"問題集 p.100のC・p.101のC-1",              short:"問題集",   labels:["p.100 C","p.101 C-1"]}
  ];

  var GROUPS = GROUP_DEFS.map(function(g){
    var items;
    if (g.labels){
      items = g.labels.map(function(lab, i){
        return {id:g.idTag+"-"+i, chip:lab, full:g.short+" "+lab};
      });
    } else {
      items = g.nums.map(function(n){
        var chip = g.pageFmt(n);
        return {id:g.idTag+"-"+n, chip:chip, full:g.short+" "+chip};
      });
    }
    items.forEach(function(it){ it.s = g.s; });
    return {s:g.s, title:g.title, items:items};
  });

  var TASKS = [];
  GROUPS.forEach(function(g){ TASKS = TASKS.concat(g.items); });

  var DEADLINE = new Date("2026-10-18T23:59:59+09:00");

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw){
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") return parsed;
      }
    }catch(e){}
    return {};
  }

  var completed = loadState();
  var resetArmed = false;

  function daysRemaining(){
    var now = new Date();
    var ms = DEADLINE.getTime() - now.getTime();
    return Math.ceil(ms / 86400000);
  }

  function subjectOf(code){
    for (var i=0;i<SUBJECTS.length;i++) if (SUBJECTS[i].code===code) return SUBJECTS[i];
    return SUBJECTS[0];
  }

  function remainingTasks(){
    return TASKS.filter(function(t){ return !completed[t.id]; });
  }

  function pickToday(){
    var days = daysRemaining();
    var remaining = remainingTasks();
    if (remaining.length === 0) return [];
    var quota = days > 0 ? Math.ceil(remaining.length / days) : remaining.length;
    quota = Math.min(quota, remaining.length);

    var bySubject = {};
    SUBJECTS.forEach(function(s){ bySubject[s.code] = remaining.filter(function(t){ return t.s===s.code; }); });

    var picked = [];
    var guard = 0;
    while (picked.length < quota && guard < 2000){
      guard++;
      var movedAny = false;
      for (var i=0;i<SUBJECTS.length && picked.length<quota;i++){
        var q = bySubject[SUBJECTS[i].code];
        if (q && q.length){
          picked.push(q.shift());
          movedAny = true;
        }
      }
      if (!movedAny) break;
    }
    return picked;
  }

  function todayRow(t){
    var done = !!completed[t.id];
    return (
      '<button class="task'+(done?' done':'')+'" data-id="'+t.id+'" type="button">'+
        '<span class="box"><svg viewBox="0 0 24 24"><polyline points="4,13 9,18 20,6"></polyline></svg></span>'+
        '<span class="label">'+t.full+'</span>'+
      '</button>'
    );
  }

  function chipBtn(t, subj){
    var done = !!completed[t.id];
    var wide = t.chip.length > 4 ? ' wide' : '';
    var style = done
      ? 'background:var('+subj.c+');border-color:var('+subj.c+');color:#fff'
      : 'color:var('+subj.c+')';
    return '<button class="chip'+wide+'" data-id="'+t.id+'" type="button" style="'+style+'">'+t.chip+'</button>';
  }

  function render(){
    var total = TASKS.length;
    var doneCount = total - remainingTasks().length;
    var pct = Math.round((doneCount/total)*100);
    var days = daysRemaining();
    var todayList = pickToday();

    var html = '';

    html += '<header><h1>中間考査スタディプラン</h1>'+
      '<div class="sub">10/20(火)幾何・英語 ／ 10/21(水)国語・社会 ／ 10/22(木)代数・物理生物・地学</div></header>';

    html += '<div class="card">'+
      '<div class="stat-row">'+
        '<div class="stat"><span class="num">'+(days>0?days:0)+'</span><span class="lbl">10/18までの残り日数</span></div>'+
        '<div class="stat"><span class="num">'+doneCount+' / '+total+'</span><span class="lbl">完了したページ・項目</span></div>'+
        '<div class="stat"><span class="num">'+pct+'%</span><span class="lbl">進捗</span></div>'+
      '</div>'+
      '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
    '</div>';

    if (doneCount === total){
      html += '<div class="done-banner" style="display:block">全範囲おつかれさま！10/18までに一周完了です 🎉</div>';
    } else {
      html += '<div class="card today-card">'+
        '<div class="section-title">今日やる分 <span class="count">('+todayList.length+'個)</span></div>';
      if (todayList.length){
        var bySubjectToday = {};
        todayList.forEach(function(t){
          (bySubjectToday[t.s] = bySubjectToday[t.s] || []).push(t);
        });
        var subBlocks = SUBJECTS.filter(function(s){ return bySubjectToday[s.code] && bySubjectToday[s.code].length; })
          .map(function(s){
            var items = bySubjectToday[s.code];
            return '<div class="today-sub">'+
              '<div class="today-sub-head"><span class="swatch" style="background:var('+s.c+')"></span>'+s.name+
                ' <span class="cnt">('+items.length+'個)</span></div>'+
              '<div class="today-rows">'+items.map(todayRow).join('')+'</div>'+
            '</div>';
          }).join('');
        html += '<div class="today-list">'+subBlocks+'</div>';
      } else {
        html += '<div class="today-empty">今日の分はありません。</div>';
      }
      html += '</div>';
    }

    SUBJECTS.forEach(function(s){
      var sGroups = GROUPS.filter(function(g){ return g.s===s.code; });
      var sTasks = TASKS.filter(function(t){ return t.s===s.code; });
      var sDone = sTasks.filter(function(t){ return completed[t.id]; }).length;

      var groupsHtml = sGroups.map(function(g){
        var gDone = g.items.filter(function(t){ return completed[t.id]; }).length;
        return '<div class="group">'+
          '<div class="group-title"><span>'+g.title+'</span><span class="gcount">'+gDone+'/'+g.items.length+'</span></div>'+
          '<div class="chip-grid">'+g.items.map(function(t){ return chipBtn(t, s); }).join('')+'</div>'+
        '</div>';
      }).join('');

      html += '<div class="card">'+
        '<div class="subject-head">'+
          '<div class="subject-name"><span class="swatch" style="background:var('+s.c+')"></span>'+s.name+'</div>'+
          '<div class="subject-meta">'+s.day+' 試験 ・ '+sDone+'/'+sTasks.length+'</div>'+
        '</div>'+
        groupsHtml+
      '</div>';
    });

    html += '<div class="reset-row"><button class="reset-btn'+(resetArmed?' confirm':'')+'" id="resetBtn" type="button">'+
      (resetArmed ? 'もう一度タップでチェックを全部リセット' : 'すべてのチェックをリセット')+'</button></div>';

    document.getElementById("app").innerHTML = html;
    wireEvents();
  }

  function wireEvents(){
    var app = document.getElementById("app");
    app.querySelectorAll(".task, .chip").forEach(function(btn){
      btn.addEventListener("click", function(){
        toggle(btn.getAttribute("data-id"));
      });
    });
    var resetBtn = document.getElementById("resetBtn");
    if (resetBtn){
      resetBtn.addEventListener("click", function(){
        if (resetArmed){
          completed = {};
          resetArmed = false;
          render();
          save();
        } else {
          resetArmed = true;
          render();
          setTimeout(function(){ resetArmed = false; render(); }, 3000);
        }
      });
    }
  }

  function toggle(id){
    completed[id] = !completed[id];
    render();
    save();
  }

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(completed)); }catch(e){}
  }

  render();
  setInterval(render, 60000);
})();
</script>
</body>
</html>
